name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias  #instalando dependencias
        run: npm ci
      - name: Correr Lint #quitado el format check para lab 3
        run: npm run lint
      - name: Correr test:unit
        run: npm run test:unit
